name: Build RedUnion recovery

on:
  workflow_dispatch:

concurrency:
  group: build-recovery-mt6789
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev unzip fontconfig bc rsync libxml2-utils xsltproc patch

      - name: Install repo tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          git config --global user.email "ci@stxlvn.local"
          git config --global user.name "ci"
          git config --global color.ui false

      - name: Sync OrangeFox minimal manifest + sources
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git ofsync
          cd ofsync
          ./orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/workspace"

      - name: Add realme10 device tree
        run: |
          git clone --depth=1 -b orangefox-12.1 \
            https://github.com/stxlvn/recovery_device_realme_RMX3630.git \
            workspace/device/realme/RMX3630

      - name: Build vendor_boot image
        working-directory: workspace
        run: |
          source build/envsetup.sh
          lunch twrp_RMX3630-eng
          mka vendorbootimage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: redunion-recovery-mt6789-${{ github.run_number }}
          path: workspace/out/target/product/RMX3630/vendor_boot.img
          if-no-files-found: error
          retention-days: 14
