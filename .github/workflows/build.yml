name: Build RedUnion recovery

on:
  workflow_dispatch:

concurrency:
  group: build-recovery-mt6789
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev unzip fontconfig bc rsync libxml2-utils xsltproc

      - name: Install repo tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          git config --global user.email "ci@stxlvn.local"
          git config --global user.name "ci"
          git config --global color.ui false

      - name: repo sync
        run: |
          mkdir -p workspace && cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/local_manifest.xml" .repo/local_manifests/
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Build vendor_boot image
        working-directory: workspace
        run: |
          source build/envsetup.sh
          lunch twrp_RMX3630-eng
          mka vendorbootimage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: redunion-recovery-mt6789-${{ github.run_number }}
          path: workspace/out/target/product/RMX3630/vendor_boot.img
          if-no-files-found: error
          retention-days: 14
